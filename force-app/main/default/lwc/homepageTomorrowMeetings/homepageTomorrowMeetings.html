<template><h3 data-heading tabindex="-1" class="assistive">Tomorrow’s meetings</h3><p role="status" class="assistive">{announcement}</p>
<template lwc:if={setupMessage}><div class="state-message"><lightning-icon icon-name="utility:info" size="x-small" class="" alternative-text=""></lightning-icon><p>{setupMessage}</p></div></template>
<template lwc:if={errorMessage}><section class="error-state" role="alert">
    <div class="error-heading"><lightning-icon icon-name="utility:warning" size="x-small" class="" alternative-text=""></lightning-icon><strong>Meetings couldn’t load</strong></div>
    <p>Use the refresh icon to try again.</p>
    <details class="error-details"><summary>Technical details</summary><pre>{errorDetails}</pre></details>
</section></template>
<template lwc:if={loading}><div class="loading-state" role="status"><span class="loading-dot"></span><span>Loading meetings…</span></div></template><template for:each={visibleMeetings} for:item="meeting">
<article class="meeting" key={meeting.id}>
    <div class="meeting-topline"><span class="meeting-time"><lightning-icon icon-name="utility:clock" size="x-small" class="" alternative-text=""></lightning-icon>{meeting.timeLabel}</span><span class={meeting.timingClass}>{meeting.timing}</span></div>
    <a class="subject" href={meeting.eventUrl} data-event-id={meeting.id} onclick={handleRecord}>{meeting.subject}</a>
    <a class="opportunity" href={meeting.opportunityUrl} data-event-id={meeting.id} data-kind="opportunity" onclick={handleRecord}><lightning-icon icon-name="utility:linked" size="x-small" class="" alternative-text=""></lightning-icon><span>{meeting.opportunity}</span></a>
    <template lwc:if={meeting.rescheduling}><span class="rescheduling">Rescheduling</span></template>
    <dl class="meeting-meta"><div><dt>Category</dt><dd>{meeting.category}</dd></div><div><dt>Topic</dt><dd>{meeting.topic}</dd></div></dl>
    <details class="person-details"><summary><lightning-icon icon-name="utility:user" size="x-small" class="" alternative-text=""></lightning-icon><span><span class="person-label">Primary person</span>{meeting.person}</span></summary>
        <p>Primary related person only. Full attendee list unavailable. <a href={meeting.eventUrl} data-event-id={meeting.id} onclick={handleRecord}>Open event</a></p>
    </details>
    <div class="meeting-action"><template lwc:if={meeting.impactUrl}><a class="impact" href={meeting.impactUrl} target="_blank" rel="noopener noreferrer" data-event-id={meeting.id} onclick={handleImpact}>Open Impact Assessment <lightning-icon icon-name="utility:new_window" size="x-small" class="" alternative-text=""></lightning-icon><span class="assistive">(opens in a new tab)</span></a></template>
    <template lwc:else><button class="impact" disabled>Open Impact Assessment</button><span class="pending">Setup pending</span></template></div>
</article></template><template lwc:if={isEmpty}><div class="empty-state"><lightning-icon icon-name="utility:event" size="small" class="" alternative-text=""></lightning-icon><p>{emptyText}</p></div></template>
<template lwc:if={showFooter}><footer class="agenda-footer"><span class="quiet">{statusText}</span><button class="text-action" onclick={handleViewAll}>{viewAllLabel}<lightning-icon icon-name="utility:arrowright" size="x-small" class="" alternative-text=""></lightning-icon></button></footer></template></template>
